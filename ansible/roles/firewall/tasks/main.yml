---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
  tags: [install]

- name: Write the hand-written ruleset (checked with a dry run first)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: nft -c -f %s
  notify: Load the ruleset
  tags: [config]

- name: Enable the nftables service at boot
  ansible.builtin.service:
    name: nftables
    enabled: true
  tags: [service]
