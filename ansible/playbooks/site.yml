---
- name: Skeleton play
  hosts: all
  gather_facts: false
  tasks:
    - name: Confirm that the example inventory loads
      ansible.builtin.debug:
        msg: "Example inventory loaded for {{ inventory_hostname }}"

- name: Give every host its own resolver
  hosts: all
  become: true
  gather_facts: false
  roles:
    - role: resolver

- name: Give the edge host its hand-written firewall
  hosts: edge
  become: true
  gather_facts: false
  roles:
    - role: firewall
