name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            ansible-core==2.21.5 ansible-lint==26.10.1 yamllint==1.38.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        working-directory: ansible
        run: ansible-lint

      - name: Syntax-check the playbooks
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Test the resolver role (the second run must change nothing)
        working-directory: ansible
        shell: bash
        run: |
          export RESOLVER_TEST_FILE="$RUNNER_TEMP/interfaces.test"
          ansible-playbook tests/resolver.yml --skip-tags verify
          ansible-playbook tests/resolver.yml --skip-tags verify | tee "$RUNNER_TEMP/second-run.log"
          grep -Eq 'changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/second-run.log"

      - name: Install nftables for the dry-run check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables

      - name: Test the firewall role (dry run only, rules are never loaded)
        working-directory: ansible
        shell: bash
        run: |
          export FIREWALL_TEST_FILE="$RUNNER_TEMP/nftables.test"
          run_test() {
            sudo --preserve-env=FIREWALL_TEST_FILE "$RUNNER_TEMP/venv/bin/ansible-playbook" tests/firewall.yml --skip-tags install,service
          }
          run_test
          run_test | tee "$RUNNER_TEMP/firewall-second-run.log"
          grep -Eq 'changed=0 +unreachable=0 +failed=0' "$RUNNER_TEMP/firewall-second-run.log"

      - name: Prove that the dry run rejects a Docker-style file
        working-directory: ansible
        run: |
          if sudo nft -c -f tests/files/docker-style.nft; then
            echo "The Docker-style file was accepted, so the dry run protects nothing"
            exit 1
          fi

      - name: Check for disallowed addresses
        run: ./scripts/check-addresses.sh

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact .'
